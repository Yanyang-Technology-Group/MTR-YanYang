pluginManagement {
	repositories {
		maven { url = "https://maven.fabricmc.net/" }
		maven { url = "https://maven.minecraftforge.net/" }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id "org.gradle.toolchains.foojay-resolver-convention" version "+"
}

include("fabric")
include("forge")

rootProject.name = "Minecraft-Transit-Railway"

// Only the dependency-free Java 17 compute module is shared with the newer TSC checkout.
includeBuild("../Transport-Simulation-Core/path-computation")
