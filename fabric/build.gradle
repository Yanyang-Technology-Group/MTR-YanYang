import org.apache.tools.ant.filters.ReplaceTokens
import org.mtr.core.Generator
import org.mtr.core.WebserverSetup
import org.mtr.mod.BuildTools

plugins {
	id "fabric-loom" version "1.10-SNAPSHOT"
}

final BuildTools buildTools = new BuildTools(minecraftVersion, "fabric", project)

loom {
	accessWidenerPath = file("src/main/resources/mtr.accesswidener")
	runConfigs.configureEach { ideConfigGenerated = true }
	mixin { setDefaultRefmapName("mtr.refmap.json") }
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	mappings "net.fabricmc:yarn:${buildTools.getYarnVersion()}:v2"
	modImplementation "net.fabricmc:fabric-loader:${buildTools.getFabricVersion()}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${buildTools.getFabricApiVersion()}"
	modApi("com.terraformersmc:modmenu:${buildTools.getModMenuVersion()}") { exclude group: "net.fabricmc", module: "fabric-loader" }
	shadowImplementation "org.mtr:Minecraft-Mappings-fabric-${minecraftVersion}:0.0.1-dev"
	testImplementation "org.junit.jupiter:junit-jupiter-api:5.+"
	testImplementation "org.junit.platform:junit-platform-launcher:1.+"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.+"
	testImplementation "maven.modrinth:iris:${minecraftVersion == '1.20.4' ? '1.7.2+1.20.4' : '1.7.6+1.20.1'}"

	if (buildTools.hasJadeSupport()) {
		modCompileOnly "maven.modrinth:jade:${buildTools.getJadeVersion()}"
	}

	if (buildTools.hasWthitSupport()) {
		modCompileOnly "mcp.mobius.waila:wthit-api:${buildTools.getWthitVersion()}"
	}
}

repositories {
	maven { url = "https://maven.terraformersmc.com/" }
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(buildTools.javaLanguageVersion))
	}
	withSourcesJar()
	withJavadocJar()
}

tasks.named("processTestResources") {
	inputs.property("serverOptimizationTest", project.hasProperty("serverOptimizationTest"))
}

// ---------------------------------------------------------------------------
// Native OBJ pipeline resources
// ---------------------------------------------------------------------------
//
// The mod loads a native library through org.mtr.mod.resource.nativeobj.NativeObjPipeline,
// which looks it up at native/<os>-<arch>/ inside the jar. This stages whatever has been
// placed in native/packaged/ so a normal build picks it up.
//
// The directory is optional on purpose: a checkout with no native build produces a jar
// without the library, and the mod falls back to its original Java OBJ pipeline instead of
// failing to load. That keeps the native side genuinely optional for contributors who only
// work on the Java code.
//
// CI assembles native/packaged/ from the per-platform artifacts of
// .github/workflows/native.yml. For a local release build, run
// native/tools/build-native.ps1 and then stage the library under
// native/packaged/<os>-<arch>/ yourself.

final File packagedNatives = new File(project.rootDir, "native/packaged")

tasks.register("copyNativeModelPipeline", Copy) {
	description = "Stages native/packaged/ into the jar under native/<os>-<arch>/."
	group = "build"

	// Gradle validates a declared input directory eagerly, so a source that may legitimately
	// be absent has to be tolerated by the copy itself rather than by onlyIf. An empty
	// directory produces an empty copy, which is the "no native library" case the mod handles
	// by falling back to its Java pipeline.
	onlyIf { packagedNatives.isDirectory() }

	// Fingerprinted after the skip check so a project without the directory does not fail
	// configuration validation. inputs.dir does not accept .optional() from Groovy, which is
	// what made the first version of this task fail with "an input file was expected to be
	// present but it doesn't exist".
	if (packagedNatives.isDirectory()) {
		inputs.dir(packagedNatives)
	}

	from(packagedNatives)
	into layout.buildDirectory.dir("generated/nativeResources/native")
}

sourceSets.main.resources.srcDir(layout.buildDirectory.dir("generated/nativeResources"))

tasks.named("processResources") {
	dependsOn("copyNativeModelPipeline")
}

// The staged natives are a task output rather than a checkout directory, and they sit on the main
// resources path so the jar carries them. Every jar task that packages main sources or resources
// therefore reads a file another task produces, and Gradle rejects that as an implicit dependency
// unless the ordering is declared. processResources alone was not enough: sourcesJar fails the same
// way. It only happens when native/packaged/ exists, which is the native workflow's build-mod job
// and never the plain mod build, so it went unnoticed until natives were staged.
tasks.withType(Jar).configureEach {
	dependsOn("copyNativeModelPipeline")
}

if (project.hasProperty("serverOptimizationTest")) {
	loom {
		mods {
			mtr { sourceSet sourceSets.main }
			mtrServerOptimizationTest { sourceSet sourceSets.test }
		}
		runs {
			serverOptimizationTest {
				server()
				source sourceSets.test
				runDir "build/server-optimization-test"
			}
		}
	}
	tasks.named("runServerOptimizationTest", JavaExec) {
		javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(buildTools.javaLanguageVersion) }
		if (project.hasProperty("computeBenchmark")) {
			jvmArgs "-Dmtr.test.computeBenchmark=true"
		}
		final File runDirectory = layout.buildDirectory.dir("server-optimization-test").get().asFile
		final File testMetadata = layout.buildDirectory.file("resources/test/fabric.mod.json").get().asFile
		doFirst {
			if (!testMetadata.isFile() || !testMetadata.getText("UTF-8").contains('"id": "mtr_server_optimization_test"')) {
				throw new GradleException("Server optimization test metadata is missing or stale; expected ${testMetadata}")
			}
			delete(new File(runDirectory, "server-optimization-test.ok"))
		}
		doLast {
			final File marker = new File(runDirectory, "server-optimization-test.ok")
			if (!marker.isFile() || marker.getText("UTF-8") != "MTR_SERVER_OPTIMIZATION_INTEGRATION_OK") {
				throw new GradleException("The Fabric server exited without completing the server optimization integration assertions")
			}
		}
	}
	processTestResources {
		rename "mtr-server-optimization-test.mod.json", "fabric.mod.json"
	}
}

if (project.hasProperty("renderBatchTest")) {
	sourceSets {
		renderBatchTest {
			compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
			runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
		}
	}
	loom {
		mods {
			mtr { sourceSet sourceSets.main }
			mtrRenderBatchTest { sourceSet sourceSets.renderBatchTest }
		}
		runs {
			renderBatchTest {
				client()
				source sourceSets.renderBatchTest
				runDir "build/render-batch-test"
			}
		}
	}
	tasks.named("runRenderBatchTest", JavaExec) {
		javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(buildTools.javaLanguageVersion) }
		final File runDirectory = layout.buildDirectory.dir("render-batch-test").get().asFile
		doFirst {
			delete(new File(runDirectory, "render-batch-test.ok"))
		}
		doLast {
			final File marker = new File(runDirectory, "render-batch-test.ok")
			if (!marker.isFile() || marker.getText("UTF-8") != "MTR_RENDER_BATCH_INTEGRATION_OK") {
				throw new GradleException("The Fabric client exited without completing the render batch integration assertions")
			}
		}
	}
	processRenderBatchTestResources {
		rename "mtr-render-batch-test.mod.json", "fabric.mod.json"
	}
}

tasks.register("runRenderBatchBenchmark", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "org.mtr.mod.render.RenderBatchBenchmark"
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(buildTools.javaLanguageVersion) }
	jvmArgs "-Xms512m", "-Xmx512m"
}

