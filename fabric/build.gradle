import org.apache.tools.ant.filters.ReplaceTokens
import org.mtr.core.Generator
import org.mtr.core.WebserverSetup
import org.mtr.mod.BuildTools

plugins {
	id "fabric-loom" version "1.10-SNAPSHOT"
}

final BuildTools buildTools = new BuildTools(minecraftVersion, "fabric", project)

loom {
	accessWidenerPath = file("src/main/resources/mtr.accesswidener")
	runConfigs.configureEach { ideConfigGenerated = true }
	mixin { setDefaultRefmapName("mtr.refmap.json") }
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraftVersion}"
	mappings "net.fabricmc:yarn:${buildTools.getYarnVersion()}:v2"
	modImplementation "net.fabricmc:fabric-loader:${buildTools.getFabricVersion()}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${buildTools.getFabricApiVersion()}"
	modApi("com.terraformersmc:modmenu:${buildTools.getModMenuVersion()}") { exclude group: "net.fabricmc", module: "fabric-loader" }
	shadowImplementation "org.mtr:Minecraft-Mappings-fabric-${minecraftVersion}:0.0.1-dev"
	testImplementation "org.junit.jupiter:junit-jupiter-api:5.+"
	testImplementation "org.junit.platform:junit-platform-launcher:1.+"
	testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.+"
	testImplementation "maven.modrinth:iris:${minecraftVersion == '1.20.4' ? '1.7.2+1.20.4' : '1.7.6+1.20.1'}"

	if (buildTools.hasJadeSupport()) {
		modCompileOnly "maven.modrinth:jade:${buildTools.getJadeVersion()}"
	}

	if (buildTools.hasWthitSupport()) {
		modCompileOnly "mcp.mobius.waila:wthit-api:${buildTools.getWthitVersion()}"
	}
}

repositories {
	maven { url = "https://maven.terraformersmc.com/" }
}

java {
	toolchain {
		languageVersion.set(JavaLanguageVersion.of(buildTools.javaLanguageVersion))
	}
	withSourcesJar()
	withJavadocJar()
}

if (project.hasProperty("pathIntegrationTest")) {
	loom {
		mods {
			mtr { sourceSet sourceSets.main }
			mtrPathTest { sourceSet sourceSets.test }
		}
		runs {
			pathTest {
				server()
				source sourceSets.test
				runDir "build/path-integration"
				vmArg "-Dmtr.path.workers=4"
				vmArg "-Dmtr.path.metrics=true"
			}
		}
	}
	tasks.named("runPathTest", JavaExec) {
		javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(buildTools.javaLanguageVersion) }
	}
}

tasks.register("pathBenchmark", JavaExec) {
	dependsOn testClasses
	classpath = sourceSets.test.runtimeClasspath
	mainClass = "org.mtr.mod.data.PathBenchmark"
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(buildTools.javaLanguageVersion) }
}

processTestResources {
	rename "mtr-path-test.mod.json", "fabric.mod.json"
}

tasks.register("setupWebsiteFiles") {
//	copy {
//		outputs.upToDateWhen { false }
//		from zipTree("../libs/Transport-Simulation-Core-Build-Tools.jar")
//		into "../buildSrc/src/main/resources"
//		include "website/*.json", "website/src/styles.css", "website/src/theme.scss"
//	}

	Generator.generateTypeScript(project, "schema/resource", "../website/src/app/entity/generated")
}

// Ensures the Resource Pack Creator website has been built into website/dist/website/browser.
// WebserverSetup.setup (called from setupFiles) embeds every file in that directory into the generated
// WebserverResources class. If the directory is missing, an empty WebserverResources is silently generated and the
// in-game Resource Pack Creator button redirects to the Transport System Map instead of opening the creator.
def ensureWebsiteBuilt = {
	final File websiteDir = new File(project.rootDir, "website")
	final File distBrowserDir = new File(websiteDir, "dist/website/browser")
	if (new File(distBrowserDir, "index.html").exists()) {
		return
	}

	println "Resource Pack Creator website build output not found at ${distBrowserDir}, building it now..."
	// The website imports generated TypeScript entities, regenerate them before compiling the Angular app
	Generator.generateTypeScript(project, "schema/resource", "../website/src/app/entity/generated")

	final String npmCommand = org.gradle.internal.os.OperatingSystem.current().isWindows() ? "npm.cmd" : "npm"
	try {
		project.exec {
			workingDir websiteDir
			commandLine npmCommand, "install", "--no-audit", "--no-fund"
		}
		project.exec {
			workingDir websiteDir
			commandLine npmCommand, "run", "build"
		}
	} catch (Exception e) {
		throw new GradleException(
			"Failed to build the Resource Pack Creator website. " +
			"Please install Node.js, then run `npm install` and `npm run build` inside the `website` directory before building the mod. " +
			"Without the built website, the generated WebserverResources is empty and the Resource Pack Creator would redirect to the Transport System Map.",
			e)
	}
	if (!new File(distBrowserDir, "index.html").exists()) {
		throw new GradleException(
			"The Resource Pack Creator website build output is still missing (${distBrowserDir}/index.html). " +
			"Run `npm install` and `npm run build` inside the `website` directory, then build the mod again. " +
			"Without the built website, the generated WebserverResources is empty and the Resource Pack Creator would redirect to the Transport System Map.")
	}
}

tasks.register("buildWebsite") {
	group = "build"
	description = "Builds the Resource Pack Creator website (Angular) so it can be embedded into WebserverResources. Requires Node.js."
	doLast {
		ensureWebsiteBuilt()
	}
}

tasks.register("setupFiles") {
	// Build the website first (if not already built) so WebserverSetup embeds real resources instead of generating an empty class
	ensureWebsiteBuilt()

	copy {
		outputs.upToDateWhen { false }
		from "src/main/KeysTemplate.java"
		into "src/main/java/org/mtr/mod"
		filter(ReplaceTokens, tokens: ["version": version + "+" + minecraftVersion, "server": testServer, "debug": debug])
		rename "(.+)Template.java", "\$1.java"
	}

	copy {
		outputs.upToDateWhen { false }
		from "src/main/fabric.mod.template.json"
		into "src/main/resources"
		filter(ReplaceTokens, tokens: ["minecraft": minecraftVersion, "version": version, "java": buildTools.javaLanguageVersion.toString()])
		rename "(.+).template.json", "\$1.json"
	}

	if (buildTools.hasJadeSupport()) {
		copy {
			outputs.upToDateWhen { false }
			from "src/main/JadeConfigTemplate.java"
			into "src/main/java/org/mtr/init"
			rename "(.+)Template.java", "\$1.java"
		}
	} else {
		delete fileTree("src/main/java/org/mtr/init/JadeConfig.java")
	}

	if (buildTools.hasWthitSupport()) {
		copy {
			outputs.upToDateWhen { false }
			from "src/main/WthitConfigTemplate.java"
			into "src/main/java/org/mtr/init"
			rename "(.+)Template.java", "\$1.java"
		}

		copy {
			outputs.upToDateWhen { false }
			from "src/main/wthit_plugins_template.json"
			into "src/main/resources"
			rename "(.+)_template.json", "\$1.json"
		}
	} else {
		delete fileTree("src/main/java/org/mtr/init/WthitConfig.java")
		delete fileTree("src/main/resources/wthit_plugins.json")
	}

	buildTools.downloadTranslations(crowdinApiKey, geminiApiKey)
	buildTools.generateTranslations()
	buildTools.copyLootTables("mtr")
	buildTools.copyLootTables("mtrsteamloco")
	buildTools.copyFontDefinition()
	buildTools.copyVehicleTemplates()
	buildTools.getPatreonList(patreonApiKey)
	Generator.generateJava(project, "schema/config", "mod/generated/config", false, "mod.config")
	Generator.generateJava(project, "schema/resource", "mod/generated/resource", false, "core.data", "mod.resource")
	Generator.generateJava(project, "schema/legacy", "legacy/generated/resource", false)
	WebserverSetup.setup(project.rootDir, "fabric/", "mod")
}

build {
	doLast {
		buildTools.copyBuildFile(excludeAssets == "true")
	}
}

shadowJar {
	exclude excludeAssets == "true" ? "assets" : "abc123"
}

remapJar {
	dependsOn(shadowJar)
	mustRunAfter(shadowJar)
	inputFile = file(shadowJar.archivePath)
}

test {
	useJUnitPlatform()
	testLogging { showStandardStreams = true }
}
