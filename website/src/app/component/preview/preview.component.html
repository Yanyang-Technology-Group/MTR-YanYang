<div class="column gap">
	<mat-slide-toggle #toggle (change)="toggleDoors(toggle.checked)">开启车门</mat-slide-toggle>
	<div class="row gap-small center">
		<button mat-button (click)="resumeGame()">
			<mat-icon>hide_image</mat-icon>
			隐藏 Minecraft 暂停画面
		</button>
		<button mat-button (click)="reload()">
			<mat-icon>refresh</mat-icon>
			强制重新加载
		</button>
	</div>
</div>
