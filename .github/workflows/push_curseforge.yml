name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose assets should be published
        required: true
        type: string

jobs:
  publish-curseforge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [ "fab", "for", "nf" ]
        mc-version: [ "1.20.1", "1.20.4", "1.21.1", "1.21.4" ]
    steps:
      - name: Resolve artifact loader
        id: asset
        run: |
          case "${{ matrix.loader }}" in
            nf) echo "name=neofor" >> "$GITHUB_OUTPUT" ;;
            *)  echo "name=${{ matrix.loader }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download Release Assets
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.release.tag_name || inputs.release_tag }}
          fileName: "YYMTR-${{ steps.asset.outputs.name }}.*+${{ matrix.mc-version }}_*.jar"
          out-file-path: "release-artifacts"

      - name: Check file exists
        id: check
        run: |
          if find release-artifacts -maxdepth 1 -type f \
            -name "YYMTR-${{ steps.asset.outputs.name }}.*+${{ matrix.mc-version }}_*.jar" \
            ! -name '*-server.jar' -print -quit | grep -q .; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve jar file path
        id: resolve
        if: steps.check.outputs.found == 'true'
        run: |
          FILE=$(find release-artifacts -maxdepth 1 -type f \
            -name "YYMTR-${{ steps.asset.outputs.name }}.*+${{ matrix.mc-version }}_*.jar" \
            ! -name '*-server.jar' | sort | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No client jar found for ${{ matrix.loader }} / ${{ matrix.mc-version }}" >&2
            exit 1
          fi

          FILE_NAME=${FILE##*/}
          if [[ "$FILE_NAME" =~ ^YYMTR-${{ steps.asset.outputs.name }}\.([^+]+)\+([^_]+)_([0-9]{4}\.[0-9]{2}\.[0-9]{2})\.([0-9]+)\.jar$ ]] \
            && [[ "${BASH_REMATCH[2]}" == "${{ matrix.mc-version }}" ]]; then
            VERSION="${{ matrix.loader }}_${BASH_REMATCH[2]}+${BASH_REMATCH[1]}-${BASH_REMATCH[4]}"
          else
            echo "Unexpected release asset filename: $FILE_NAME" >&2
            exit 1
          fi
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved file: $FILE"
          echo "Resolved version: $VERSION"

      - name: Map loader to CurseForge name
        id: loader
        if: steps.check.outputs.found == 'true'
        run: |
          case "${{ matrix.loader }}" in
            fab) echo "name=Fabric" >> $GITHUB_OUTPUT ;;
            for) echo "name=Forge" >> $GITHUB_OUTPUT ;;
            nf)  echo "name=NeoForge" >> $GITHUB_OUTPUT ;;
          esac

      - name: Set dependencies
        id: deps
        if: steps.check.outputs.found == 'true'
        run: |
          case "${{ matrix.loader }}" in
            fab) echo "relations=fabric-api:requiredDependency" >> $GITHUB_OUTPUT ;;
            for) echo "relations=forge:requiredDependency" >> $GITHUB_OUTPUT ;;
            nf)  echo "relations=neoforge:requiredDependency" >> $GITHUB_OUTPUT ;;
          esac

      - name: Determine release type
        id: rtype
        if: steps.check.outputs.found == 'true'
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "type=beta" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi

      - name: Publish to CurseForge
        if: steps.check.outputs.found == 'true'
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: "1705900"
          game_endpoint: "minecraft"
          file_path: "${{ steps.resolve.outputs.file }}"
          game_versions: "Minecraft ${{ matrix.mc-version }},${{ steps.loader.outputs.name }}"
          release_type: "${{ steps.rtype.outputs.type }}"
          display_name: "${{ steps.resolve.outputs.version }}"
          changelog: "${{ github.event.release.body }}"
          changelog_type: "markdown"
          relations: "${{ steps.deps.outputs.relations }}"
