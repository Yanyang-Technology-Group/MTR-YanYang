name: Publish to CurseForge

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish-curseforge:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [ "fab", "for", "nf" ]
        mc-version: [ "1.20.1", "1.20.4", "1.21.1", "1.21.4" ]
    steps:
      - name: Download Release Assets
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.release.tag_name }}
          fileName: "YYMTR-${{ matrix.loader }}.*+${{ matrix.mc-version }}_*.jar"
          out-file-path: "release-artifacts"

      - name: Check file exists
        id: check
        run: |
          if ls release-artifacts/YYMTR-${{ matrix.loader }}.*+${{ matrix.mc-version }}_*.jar 1> /dev/null 2>&1; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve jar file path
        id: resolve
        if: steps.check.outputs.found == 'true'
        run: |
          FILE=$(ls release-artifacts/YYMTR-${{ matrix.loader }}.*+${{ matrix.mc-version }}_*.jar | head -n 1)
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "Resolved file: $FILE"

      - name: Map loader to CurseForge name
        id: loader
        if: steps.check.outputs.found == 'true'
        run: |
          case "${{ matrix.loader }}" in
            fab) echo "name=Fabric" >> $GITHUB_OUTPUT ;;
            for) echo "name=Forge" >> $GITHUB_OUTPUT ;;
            nf)  echo "name=NeoForge" >> $GITHUB_OUTPUT ;;
          esac

      - name: Set dependencies
        id: deps
        if: steps.check.outputs.found == 'true'
        run: |
          case "${{ matrix.loader }}" in
            fab) echo "relations=fabric-api:requiredDependency" >> $GITHUB_OUTPUT ;;
            for) echo "relations=forge:requiredDependency" >> $GITHUB_OUTPUT ;;
            nf)  echo "relations=neoforge:requiredDependency" >> $GITHUB_OUTPUT ;;
          esac

      - name: Publish to CurseForge
        if: steps.check.outputs.found == 'true'
        uses: itsmeow/curseforge-upload@v3
        with:
          token: ${{ secrets.CURSEFORGE_TOKEN }}
          project_id: "1705900"
          game_endpoint: "minecraft"
          file_path: "${{ steps.resolve.outputs.file }}"
          game_versions: "Minecraft ${{ matrix.mc-version }},${{ steps.loader.outputs.name }}"
          release_type: "release"
          display_name: "${{ github.event.release.name }} (${{ matrix.mc-version }} ${{ steps.loader.outputs.name }})"
          changelog: "${{ github.event.release.body }}"
          changelog_type: "markdown"
          relations: "${{ steps.deps.outputs.relations }}"
