name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag whose assets should be published
        required: true
        type: string

jobs:
  publish-modrinth:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [ "fab", "for", "nf" ]
        mc-version: [ "1.20.1", "1.20.4", "1.21.1", "1.21.4" ]
    steps:
      - name: Resolve artifact loader
        id: asset
        run: |
          case "${{ matrix.loader }}" in
            nf) echo "name=neofor" >> "$GITHUB_OUTPUT" ;;
            *)  echo "name=${{ matrix.loader }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Download Release Assets
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          tag: ${{ github.event.release.tag_name || inputs.release_tag }}
          fileName: "YYMTR-${{ steps.asset.outputs.name }}.*+${{ matrix.mc-version }}_*.jar"
          out-file-path: "release-artifacts"

      - name: Check file exists
        id: check
        run: |
          if find release-artifacts -maxdepth 1 -type f \
            -name "YYMTR-${{ steps.asset.outputs.name }}.*+${{ matrix.mc-version }}_*.jar" \
            ! -name '*-server.jar' -print -quit | grep -q .; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Resolve jar file and version
        id: resolve
        if: steps.check.outputs.found == 'true'
        run: |
          FILE=$(find release-artifacts -maxdepth 1 -type f \
            -name "YYMTR-${{ steps.asset.outputs.name }}.*+${{ matrix.mc-version }}_*.jar" \
            ! -name '*-server.jar' | sort | head -n 1)
          if [ -z "$FILE" ]; then
            echo "No client jar found for ${{ matrix.loader }} / ${{ matrix.mc-version }}" >&2
            exit 1
          fi

          FILE_NAME=${FILE##*/}
          if [[ "$FILE_NAME" =~ ^YYMTR-${{ steps.asset.outputs.name }}\.([^+]+)\+([^_]+)_([0-9]{4}\.[0-9]{2}\.[0-9]{2})\.([0-9]+)\.jar$ ]] \
            && [[ "${BASH_REMATCH[2]}" == "${{ matrix.mc-version }}" ]]; then
            VERSION="${{ matrix.loader }}_${BASH_REMATCH[2]}+${BASH_REMATCH[1]}-${BASH_REMATCH[4]}"
          else
            echo "Unexpected release asset filename: $FILE_NAME" >&2
            exit 1
          fi
          echo "file=$FILE" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Resolved file: $FILE"
          echo "Resolved version: $VERSION"

      - name: Map loader to Modrinth name
        id: loader
        if: steps.check.outputs.found == 'true'
        run: |
          case "${{ matrix.loader }}" in
            fab) echo "name=fabric" >> $GITHUB_OUTPUT ;;
            for) echo "name=forge" >> $GITHUB_OUTPUT ;;
            nf)  echo "name=neoforge" >> $GITHUB_OUTPUT ;;
          esac

      - name: Set dependencies
        id: deps
        if: steps.check.outputs.found == 'true'
        run: |
          case "${{ matrix.loader }}" in
            fab) echo "deps=fabric-api@*" >> $GITHUB_OUTPUT ;;
            for) echo "deps=forge@*" >> $GITHUB_OUTPUT ;;
            nf)  echo "deps=neoforge@*" >> $GITHUB_OUTPUT ;;
          esac

      - name: Determine version type
        id: vtype
        if: steps.check.outputs.found == 'true'
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            echo "type=beta" >> $GITHUB_OUTPUT
          else
            echo "type=release" >> $GITHUB_OUTPUT
          fi

      - name: Publish to Modrinth
        if: steps.check.outputs.found == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: "KJKYqhp2"
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: "${{ steps.resolve.outputs.file }}"
          name: "${{ github.event.release.name }} (${{ matrix.mc-version }} ${{ steps.loader.outputs.name }})"
          version: "${{ steps.resolve.outputs.version }}"
          version-type: "${{ steps.vtype.outputs.type }}"
          changelog: "${{ github.event.release.body }}"
          loaders: "${{ steps.loader.outputs.name }}"
          game-versions: "${{ matrix.mc-version }}"
          dependencies: "${{ steps.deps.outputs.deps }}"
